<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>籤譜後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#F6F6F3;-webkit-user-select:text;user-select:text}
.login form{width:100%;max-width:360px;background:#fff;border:1px solid #E8E8E3;border-radius:14px;padding:24px}
.login h1{margin:0 0 4px;font-family:var(--serif);font-size:22px;letter-spacing:.1em}
.login p{margin:0 0 16px;color:#777;font-size:14px}
.login label{display:block;font-size:13px;font-weight:700;color:#555;margin-top:12px}
.login input{display:block;width:100%;margin-top:4px;border:1px solid #D5D5CF;border-radius:8px;padding:11px 12px;font-size:16px}
.login button{margin-top:18px;width:100%;min-height:46px;border:0;border-radius:10px;background:#B8342C;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.login .err{color:#B8342C;font-size:14px;margin-top:10px;min-height:1.4em}
</style>
</head>
<body>
<div id="root"></div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h1>籤譜後台</h1>
    <p>登入後就能管理所有題目</p>
    <label>Email<input type="email" id="em" autocomplete="username" required></label>
    <label>密碼<input type="password" id="pw" autocomplete="current-password" required></label>
    <button type="submit" id="loginBtn">登入</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var C=window.QP_CONFIG||{};
  var sb=window.supabase.createClient(C.url,C.anonKey);
  var $=function(s){return document.querySelector(s)};
  function showLogin(msg){$("#login").hidden=false;$("#root").innerHTML="";$("#loginErr").textContent=msg||""}
  function start(){
    $("#login").hidden=true;
    $("#root").innerHTML='<div class="login"><p>資料載入中…</p></div>';
    sb.from("qianpu").select("data").eq("id","main").maybeSingle().then(function(res){
      if(res.error){showLogin("讀取資料失敗："+res.error.message);return}
      window.QP_STATE=(res.data&&res.data.data)||{site:{},topics:[]};
      window.QP_MODE="admin";
      window.QP_SAVE=function(state){
        return sb.from("qianpu").upsert({id:"main",data:state,updated_at:new Date().toISOString()}).select("id").then(function(r){
          if(r.error)throw new Error(r.error.message);
          if(!r.data||!r.data.length)throw new Error("這個帳號沒有儲存權限");
        });
      };
      window.QP_LOGOUT=function(){sb.auth.signOut().then(function(){location.reload()})};
      var s=document.createElement("script");s.src="app.js";document.body.appendChild(s);
    });
  }
  $("#loginForm").addEventListener("submit",function(e){
    e.preventDefault();$("#loginBtn").disabled=true;$("#loginErr").textContent="";
    sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value}).then(function(r){
      $("#loginBtn").disabled=false;
      if(r.error){$("#loginErr").textContent="登入失敗，請確認 Email 和密碼";return}
      start();
    });
  });
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)start();else showLogin()});
})();
</script>
</body>
</html>
